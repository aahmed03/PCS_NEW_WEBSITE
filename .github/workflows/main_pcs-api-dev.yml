name: Build and deploy Python app to Azure Web App - pcs-api-dev

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      # ❌ REMOVE Python setup + pip install
      # Azure (Oryx) will handle this

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_CBF2A72A236E482AA01ED42690F82D79 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_23649D7CCC704F2D875CA854BF60D22E }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_0C8C0374BD30429CA53F42AF82CB9D34 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: pcs-api-dev
          slot-name: Production
          package: .



          