name: Build and deploy Python app to Azure Web App - pcs-api-dev

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_CBF2A72A236E482AA01ED42690F82D79 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_23649D7CCC704F2D875CA854BF60D22E }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_0C8C0374BD30429CA53F42AF82CB9D34 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: pcs-api-dev
          slot-name: Production
          package: .

      # ✅ Optional: verify API is up after deploy
      - name: Smoke test /api/health
        run: |
          set -e
          URL="https://pcs-api-dev-fdacbseyd9audvfg.centralus-01.azurewebsites.net/api/health"
          echo "Checking $URL"
          for i in {1..10}; do
            if curl -fsS "$URL" | grep -q '"status":"ok"'; then
              echo "✅ API healthy"
              exit 0
            fi
            echo "Waiting for API to start... ($i/10)"
            sleep 5
          done
          echo "❌ API health check failed"
          exit 1



          