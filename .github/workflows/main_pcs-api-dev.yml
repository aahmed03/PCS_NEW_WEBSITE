name: Build and deploy Python app to Azure Web App - pcs-api-dev

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies (validation only)
        run: |
          python -m venv antenv
          source antenv/bin/activate
          pip install -r requirements.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: |
            .
            !antenv/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: python-app
          path: app   # <— IMPORTANT: put the artifact in a known folder

      - name: Verify artifact contents (sanity check)
        run: |
          ls -la app
          find app -maxdepth 3 -type f -name "server.py" -print
          test -f app/requirements.txt
          test -d app/backend

      - name: Login to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_CBF2A72A236E482AA01ED42690F82D79 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_23649D7CCC704F2D875CA854BF60D22E }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_0C8C0374BD30429CA53F42AF82CB9D34 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: pcs-api-dev
          slot-name: Production
          package: app        # <— IMPORTANT: explicitly deploy THIS folder
          clean: true         # <— recommended to avoid stale leftovers

          