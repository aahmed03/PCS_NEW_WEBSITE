name: Azure Static Web Apps CI/CD - pcs-web-dev

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Quick sanity check: confirms secret is injected (won't print it)
      - name: Verify token is present
        env:
          SWA_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_PCS_WEB_DEV }}
        run: |
          if [ -z "$SWA_TOKEN" ]; then
            echo "❌ SWA token secret is missing."
            exit 1
          fi
          echo "✅ Token length: ${#SWA_TOKEN}"

      - name: Build and Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_PCS_WEB_DEV }}
          action: upload
          app_location: "frontend"
          api_location: ""
          output_location: "build"
