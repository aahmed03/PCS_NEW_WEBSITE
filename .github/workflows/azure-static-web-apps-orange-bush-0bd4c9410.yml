name: Azure Static Web Apps CI/CD - pcs-web-dev

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build_and_deploy_job:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Optional sanity check: confirms the secret exists (won’t print token)
      - name: Verify token is present
        shell: bash
        run: |
          if [ -z "${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_PCS_WEB_DEV }}" ]; then
            echo "❌ SWA token secret is EMPTY or not available to this run."
            exit 1
          fi
          echo "✅ SWA token secret is present."

      - name: Build and Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_PCS_WEB_DEV }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "frontend"
          api_location: ""
          output_location: "build"













