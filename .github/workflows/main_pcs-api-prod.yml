name: Build and deploy Python app to Azure Web App - pcs-api-prod

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_8329C91CF85B41C1859AD0C026A415D2 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_8E69636373A34371A1BF8CF8E5707E2B }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_F9A8B5D8606446E199FA597D6CFAD8B3 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: pcs-api-prod
          slot-name: Production
          package: .

      - name: Smoke test /api/health
        run: |
          set -e
          URL="https://pcs-api-prod-d7bdb9bfbta5d5b2.centralus-01.azurewebsites.net/api/health"
          echo "Checking $URL"
          for i in {1..20}; do
            if curl -fsS "$URL" | grep -q '"status":"ok"'; then
              echo "✅ API healthy"
              exit 0
            fi
            echo "Waiting for API to start... ($i/20)"
            sleep 5
          done
          echo "❌ API health check failed"
          exit 1

          