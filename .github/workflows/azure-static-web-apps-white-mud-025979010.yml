name: Azure Static Web Apps CI/CD

on:
  push:
    branches: [ main ]

jobs:
  build_and_deploy_job:
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      # (Optional) confirm token is available (doesn't print token)
      - name: Confirm SWA token present
        env:
          SWA_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WHITE_MUD_025979010 }}
        run: |
          if [ -z "$SWA_TOKEN" ]; then
            echo "❌ SWA token is empty/not available"
            exit 1
          fi
          echo "✅ SWA token present"

      - name: Build And Deploy
        uses: Azure/static-web-apps-deploy@v1
        env:
          REACT_APP_DEPLOY_ENV: ${{ vars.REACT_APP_DEPLOY_ENV }}
          REACT_APP_API_URL_DEV: ${{ vars.REACT_APP_API_URL_DEV }}
          REACT_APP_API_URL_STAGE: ${{ vars.REACT_APP_API_URL_STAGE }}
          REACT_APP_API_URL_PROD: ${{ vars.REACT_APP_API_URL_PROD }}
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WHITE_MUD_025979010 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: ./frontend
          api_location: ""
          output_location: build







